name: CI

on:
  push:
    # `dev` is not optional. Work lands on `dev` and is merged into `main`, so a
    # trigger on `main` alone means the branch every change actually passes
    # through is the one branch CI never sees — `docs/SECURITY.md` §11 calls these
    # controls "automated on every push", and with `main` alone that was false
    # for the branch in active use. Verified red on `dev`: a push here produced
    # no run at all.
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test
  APP_URL: http://localhost:3000
  SESSION_SECRET: ci-only-session-secret-not-for-production-123456
  MAIL_DRIVER: console
  MAIL_FROM: "BizNexus CI <no-reply@example.test>"
  RATELIMIT_DRIVER: memory
  # Nothing listens on 27017 in CI, and this URI is never connected to. It
  # exists because src/env.ts runs its presence checks during `next build` —
  # deliberately, since a build missing MONGODB_URI or SESSION_SECRET should
  # fail — so the Build job needs the name present, not a reachable server.
  #
  # The two jobs that talk to MongoDB publish their own URI at runtime and
  # overwrite this: tests/global-setup.ts boots a MongoMemoryReplSet for the
  # unit suite, and scripts/e2e-server.mjs boots one for the E2E server.
  MONGODB_URI: mongodb://127.0.0.1:27017/biz_nexus_build
  # PLAYWRIGHT_BASE_URL is deliberately unset. The E2E job boots its own server
  # through scripts/e2e-server.mjs on port 3100, and playwright.config.ts
  # derives the port it binds from this origin. Pinning it here pointed the
  # suite at a port nothing was listening on, which surfaced as a 120s
  # webServer timeout rather than a test failure.

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

  unit-and-integration:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    # There is deliberately no `services:` block here. tests/global-setup.ts
    # boots its own MongoMemoryReplSet and hands the connection string to the
    # workers through MONGODB_URI, which also makes it a replica set — the
    # services under test need multi-document transactions, and MongoDB only
    # offers those on one.
    #
    # The container this job used to start was never read by anything. Its
    # replica set was created by a runner-side `mongosh` step, and mongosh is
    # not installed on the runner, so that step died with exit 127 before a
    # single test ran. The job pulls a ~100MB image and waits on its health
    # check to get there.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      # Reporting, not gating. The coverage gate is the threshold check inside
      # `npm run test:coverage` one step above, which has already run and passed
      # by the time this step is reached.
      #
      # The step is skipped when CODECOV_TOKEN is absent rather than failing.
      # The repository has no token configured, and Codecov rejects tokenless
      # uploads ("Token required - not valid tokenless upload"), so a hard
      # `fail_ci_if_error: true` meant a missing third-party credential failed
      # every run after the tests had already succeeded.
      #
      # The secret is passed through `env` rather than referenced in the `if`
      # directly, which GitHub does not permit. Add the secret and this step
      # starts running with no further change.
      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: true

      - name: Report coverage upload status
        if: ${{ env.CODECOV_TOKEN == '' }}
        run: |
          echo "::notice::Skipping the Codecov upload: CODECOV_TOKEN is not set."
          echo "Coverage was gated by test:coverage; only the upload is skipped."

  # `docs/SECURITY.md` §11 listed dependency auditing and secret scanning among
  # the controls "automated on every push" when neither existed in this file. A
  # documented control that is not running is worse than an absent one, so both
  # are here now rather than left as a paragraph about a gap.
  #
  # `--audit-level=high` and not `--audit-level=moderate`: npm's moderate band is
  # dominated by advisories with no exploit path for a server-side, privately
  # deployed dependency tree, and a job that fails on those trains people to
  # re-run it with `--no-audit`. High and critical are the bands where a gate is
  # worth its cost.
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks needs the history to scan commit messages and deleted
          # secrets, not just the working tree. `fetch-depth: 0` is the whole
          # cost of this job and it is what makes it able to find a secret that
          # was committed and then removed in a later commit.
          fetch-depth: 0

      # `--redact` so a hit reports the file and line without printing the
      # secret into the job log, which is the one place a leaked credential is
      # guaranteed to be readable by everyone with repository access.
      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
        with:
          args: --redact

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-and-integration, dependency-audit, secret-scan]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 1

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    # There is deliberately no `services:` block here. scripts/e2e-server.mjs
    # starts its own single-node replica set, which is what the
    # transaction-using services need, so nothing in this job reads a
    # MONGODB_URI. The replica set flags that used to be attempted here via
    # `command:` were never valid — a services block accepts only image, ports,
    # options, env, volumes and credentials — and they were why the whole
    # workflow failed to parse, taking every job down with it.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # No build artifact is downloaded here. `npm run test:e2e` builds into
      # `.next-e2e` itself, and downloading the build job's `.next` would put
      # an artefact in the tree that nothing reads.

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # MONGODB_URI is deliberately unset for this step. scripts/e2e-server.mjs
      # starts its own single-node replica set and passes that URI to the
      # server, which is what the transaction-using services need. The service
      # container above is kept for the unit-and-integration job, which does
      # read that variable.
      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7